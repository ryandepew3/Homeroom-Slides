<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Zones of Regulation</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:system-ui,sans-serif;background:#111;}
#app{display:flex;flex-direction:column;height:100vh;}
/* Header */
#hdr{background:#111;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
#hdr-title{color:#fff;font-size:21px;font-weight:500;}
#hdr-btns{display:flex;gap:8px;align-items:center;}
.hbtn{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;font-size:13px;padding:7px 14px;border-radius:8px;cursor:pointer;}
.hbtn:hover{background:rgba(255,255,255,0.28);}
#save-msg{font-size:11px;color:rgba(255,255,255,0.4);margin-right:6px;}
/* Board */
#board{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;flex:1;position:relative;overflow:hidden;}
.zone{padding:12px 8px 8px;display:flex;flex-direction:column;}
.zone-hdr{text-align:center;pointer-events:none;flex-shrink:0;margin-bottom:6px;}
.zf{width:80px;height:80px;border-radius:50%;object-fit:cover;object-position:top center;border:3px solid rgba(255,255,255,0.65);}
.zone-faces{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:8px;}
.zname{font-size:24px;font-weight:600;margin-top:4px;}
.zwords{font-size:13px;margin-top:4px;line-height:1.7;}
.zRed{background:#E8302A;border-right:3px solid #C4231E;}
.zRed .zname{color:#fff;}.zRed .zwords{color:#ffd6d4;}
.zYellow{background:#F5C800;border-right:3px solid #D4AB00;}
.zYellow .zname{color:#3d2f00;}.zYellow .zwords{color:#5a4500;}
.zGreen{background:#3BAA35;border-right:3px solid #2D8829;}
.zGreen .zname{color:#fff;}.zGreen .zwords{color:#d4f4d2;}
.zBlue{background:#2B72CC;}
.zBlue .zname{color:#fff;}.zBlue .zwords{color:#c4dbf7;}
/* Avatar layer — covers entire board */
#av-layer{position:absolute;inset:0;pointer-events:none;}
/* Roster */
#roster{background:#111;padding:8px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex-shrink:0;min-height:60px;}
/* Avatar cards */
.av{
  width:106px;border-radius:10px;overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,0.35);
  cursor:grab;
  user-select:none;
  -webkit-user-select:none;
  border:2px solid rgba(255,255,255,0.5);
  pointer-events:all;
}
.av img,.av .av-ic{width:106px;height:90px;object-fit:cover;object-position:top center;display:block;}
.av .av-ic{display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:600;color:#fff;}
.av .av-nm{height:26px;line-height:26px;background:#fff;text-align:center;font-size:11px;font-weight:600;color:#222;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.av.on-board{position:absolute;}
.av.on-board:active{cursor:grabbing;}
/* Roster av style */
.av.in-roster{position:relative;flex-shrink:0;}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,0.65);display:flex;align-items:flex-start;justify-content:center;padding-top:40px;z-index:9999;}
.modal{background:#fff;border-radius:14px;width:400px;max-height:78vh;overflow-y:auto;padding:20px;color:#222;}
.modal h3{font-size:16px;font-weight:600;margin-bottom:4px;}
.modal p{font-size:12px;color:#777;margin-bottom:14px;}
.sc{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid #e8e8e8;margin-bottom:8px;background:#fafafa;}
.sph{position:relative;flex-shrink:0;}
.sph img,.sph .sic{width:46px;height:46px;border-radius:50%;object-fit:cover;object-position:top center;}
.sph .sic{display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500;color:#fff;}
.uov{position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .15s;}
.sph:hover .uov{opacity:1;}
.uov span{color:#fff;font-size:9px;text-align:center;line-height:1.3;pointer-events:none;}
.si{flex:1;display:flex;flex-direction:column;gap:4px;}
.si input{font-size:13px;padding:5px 8px;border-radius:6px;border:1px solid #ddd;width:100%;color:#222;}
.si input:focus{outline:none;border-color:#2B72CC;}
.sht{font-size:10px;color:#999;}
.xb{background:none;border:none;font-size:22px;color:#ccc;cursor:pointer;line-height:1;flex-shrink:0;}
.xb:hover{color:#e44;}
.fi{display:none;}
.add-btn{font-size:13px;color:#2B72CC;background:none;border:none;cursor:pointer;padding:5px 0;margin-top:2px;}
.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid #eee;}
.mb{font-size:13px;padding:7px 16px;border-radius:8px;cursor:pointer;border:none;}
.mb-c{background:#f0f0f0;color:#555;}
.mb-s{background:#2B72CC;color:#fff;font-weight:500;}
</style>
</head>

<script>
const SK = "zones_v3";
const COLORS = ["#E8302A","#2B72CC","#3BAA35","#F5A623","#8B5CF6","#EC4899","#0891B2","#D97706","#059669","#DC2626"];
let students = [], temp = [];
let zTop = 10;

function ini(n){ return (n||"").trim().split(" ").map(w=>w[0]||"").slice(0,2).join("").toUpperCase()||"?"; }
function col(id){ return COLORS[Math.abs(parseInt(String(id).replace(/\D/g,"").slice(-5)||"0"))%COLORS.length]; }
function savemsg(m){ const e=document.getElementById("save-msg"); e.textContent=m; setTimeout(()=>e.textContent="",2500); }

// ── Persistence ──────────────────────────────────────────────
function persist(){
  try{ localStorage.setItem(SK, JSON.stringify(students.map(s=>({id:s.id,name:s.name,photo:s.photo})))); savemsg("Saved ✓"); }
  catch(e){ savemsg("Could not save"); }
}
function load(){
  try{
    const r = localStorage.getItem(SK);
    if(r) students = JSON.parse(r).map(s=>({...s,onBoard:false,x:0,y:0,z:0}));
  }catch(e){}
  renderAll();
}

// ── Build avatar DOM element ──────────────────────────────────
function makeAv(s, onBoard){
  const d = document.createElement("div");
  d.className = "av " + (onBoard ? "on-board" : "in-roster");
  d.dataset.sid = s.id;

  // photo or initials
  if(s.photo){
    const img = document.createElement("img");
    img.src = s.photo;
    img.style.pointerEvents = "none";
    d.appendChild(img);
  } else {
    const ic = document.createElement("div");
    ic.className = "av-ic";
    ic.style.background = col(s.id);
    ic.textContent = ini(s.name);
    ic.style.pointerEvents = "none";
    d.appendChild(ic);
  }
  const nm = document.createElement("div");
  nm.className = "av-nm";
  nm.textContent = s.name || "Student";
  nm.style.pointerEvents = "none";
  d.appendChild(nm);

  if(onBoard){
    d.style.left = s.x+"px";
    d.style.top  = s.y+"px";
    d.style.zIndex = s.z||1;
  }

  attachDrag(d, s.id, onBoard);
  return d;
}

// ── Render ────────────────────────────────────────────────────
function renderAll(){
  // Board avatars
  const layer = document.getElementById("av-layer");
  layer.innerHTML = "";
  students.filter(s=>s.onBoard).forEach(s=> layer.appendChild(makeAv(s,true)));
  // Roster avatars
  const roster = document.getElementById("roster");
  roster.innerHTML = "";
  students.filter(s=>!s.onBoard).forEach(s=> roster.appendChild(makeAv(s,false)));
}

// ── Universal drag attach ─────────────────────────────────────
function attachDrag(el, sid, onBoard){
  let startX, startY, startElX, startElY, dragging=false;

  function getStudent(){ return students.find(s=>s.id==sid); }

  function dragStart(cx, cy){
    dragging = true;
    startX = cx; startY = cy;
    const board = document.getElementById("board");
    const br = board.getBoundingClientRect();
    if(onBoard){
      // already on board — record current position
      const s = getStudent();
      startElX = s ? s.x : 0;
      startElY = s ? s.y : 0;
      s.z = ++zTop;
      el.style.zIndex = zTop;
    } else {
      // in roster — record board-relative start
      const r = el.getBoundingClientRect();
      startElX = r.left - br.left;
      startElY = r.top  - br.top;
    }
    el.style.opacity = "0.6";
    el.style.cursor  = "grabbing";
  }

  function dragMove(cx, cy){
    if(!dragging) return;
    const dx = cx - startX;
    const dy = cy - startY;
    const nx = startElX + dx;
    const ny = startElY + dy;
    const board = document.getElementById("board");
    const br = board.getBoundingClientRect();
    const cx2 = Math.max(0, Math.min(br.width  - 110, nx));
    const cy2 = Math.max(0, Math.min(br.height - 120, ny));

    if(!onBoard){
      // Move the clone-like visual: make it absolute over the board temporarily
      if(!el._flying){
        el._flying = true;
        el.classList.remove("in-roster");
        el.classList.add("on-board");
        el.style.position = "fixed";
        document.getElementById("av-layer").appendChild(el);
      }
      el.style.left = (br.left + cx2)+"px";
      el.style.top  = (br.top  + cy2)+"px";
    } else {
      el.style.left = cx2+"px";
      el.style.top  = cy2+"px";
    }
  }

  function dragEnd(cx, cy){
    if(!dragging) return;
    dragging = false;
    el.style.opacity = "";
    el.style.cursor  = "grab";

    const board  = document.getElementById("board");
    const br     = board.getBoundingClientRect();
    const roster = document.getElementById("roster");
    const rr     = roster.getBoundingClientRect();

    const s = getStudent();
    if(!s){ renderAll(); return; }

    // Dropped on roster bar?
    if(cx >= rr.left && cx <= rr.right && cy >= rr.top && cy <= rr.bottom){
      s.onBoard = false; s.x=0; s.y=0;
      renderAll();
      return;
    }

    // Place on board
    const dx = cx - startX;
    const dy = cy - startY;
    let nx = startElX + dx;
    let ny = startElY + dy;
    if(!onBoard){
      // came from roster: startElX/Y are board-relative already
    }
    nx = Math.max(0, Math.min(br.width  - 110, nx));
    ny = Math.max(0, Math.min(br.height - 120, ny));

    s.onBoard = true;
    s.x = nx; s.y = ny; s.z = ++zTop;

    // Fix element back to board-relative absolute
    el._flying = false;
    el.style.position = "";
    el.style.left = nx+"px";
    el.style.top  = ny+"px";
    el.style.zIndex = s.z;
    el.classList.remove("in-roster");
    el.classList.add("on-board");
    if(!document.getElementById("av-layer").contains(el)){
      document.getElementById("av-layer").appendChild(el);
    }
    // Update onBoard flag so future drags work
    onBoard = true;
    startElX = nx; startElY = ny;
  }

  // Mouse
  el.addEventListener("mousedown", e=>{
    if(e.button!==0) return;
    e.preventDefault();
    dragStart(e.clientX, e.clientY);
    const mm = e2=>dragMove(e2.clientX, e2.clientY);
    const mu = e2=>{ dragEnd(e2.clientX, e2.clientY); document.removeEventListener("mousemove",mm); document.removeEventListener("mouseup",mu); };
    document.addEventListener("mousemove", mm);
    document.addEventListener("mouseup",   mu);
  });

  // Touch
  el.addEventListener("touchstart", e=>{
    e.preventDefault();
    const t = e.touches[0];
    dragStart(t.clientX, t.clientY);
  },{passive:false});
  el.addEventListener("touchmove", e=>{
    e.preventDefault();
    const t = e.touches[0];
    dragMove(t.clientX, t.clientY);
  },{passive:false});
  el.addEventListener("touchend", e=>{
    const t = e.changedTouches[0];
    dragEnd(t.clientX, t.clientY);
  });
}

// ── Reset ─────────────────────────────────────────────────────
function resetAll(){ students.forEach(s=>{s.onBoard=false;s.x=0;s.y=0;}); renderAll(); }

// ── Modal ─────────────────────────────────────────────────────
function openModal(){
  temp = students.map(s=>({...s}));
  renderRows();
  document.getElementById("app").style.display="none";
  document.getElementById("modal-wrap").style.display="block";
}
function closeModal(){
  document.getElementById("modal-wrap").style.display="none";
  document.getElementById("app").style.display="flex";
}
function renderRows(){
  const c = document.getElementById("s-rows"); c.innerHTML="";
  temp.forEach((s,i)=>{
    const card = document.createElement("div"); card.className="sc";
    const pw = document.createElement("div"); pw.className="sph";
    const refresh=()=>{
      pw.querySelector("img,.sic")?.remove();
      if(temp[i].photo){ const img=document.createElement("img"); img.src=temp[i].photo; pw.insertBefore(img,pw.firstChild); }
      else{ const ic=document.createElement("div"); ic.className="sic"; ic.style.background=col(s.id); ic.textContent=ini(temp[i].name); pw.insertBefore(ic,pw.firstChild); }
    };
    refresh();
    const uov=document.createElement("div"); uov.className="uov"; uov.innerHTML="<span>tap to<br>upload</span>";
    const fi=document.createElement("input"); fi.type="file"; fi.accept="image/*"; fi.className="fi";
    fi.addEventListener("change",function(){
      const f=this.files[0]; if(!f) return;
      const r=new FileReader();
      r.onload=ev=>{ temp[i].photo=ev.target.result; refresh(); hint.textContent="Photo uploaded — tap to change"; };
      r.readAsDataURL(f);
    });
    uov.addEventListener("click",()=>fi.click());
    pw.appendChild(uov); pw.appendChild(fi);
    const info=document.createElement("div"); info.className="si";
    const ni=document.createElement("input"); ni.type="text"; ni.value=s.name; ni.placeholder="Student name";
    ni.addEventListener("input",function(){ temp[i].name=this.value; if(!temp[i].photo){ const ic=pw.querySelector(".sic"); if(ic) ic.textContent=ini(this.value); } });
    const hint=document.createElement("div"); hint.className="sht"; hint.textContent=s.photo?"Photo uploaded — tap to change":"No photo — tap circle to upload";
    info.appendChild(ni); info.appendChild(hint);
    const xb=document.createElement("button"); xb.className="xb"; xb.textContent="×"; xb.addEventListener("click",()=>{ temp.splice(i,1); renderRows(); });
    card.appendChild(pw); card.appendChild(info); card.appendChild(xb); c.appendChild(card);
  });
}
function addRow(){ temp.push({id:"s_"+Date.now(),name:"",photo:null,onBoard:false,x:0,y:0,z:0}); renderRows(); }
function saveStudents(){
  const ez={}; students.forEach(s=>{ ez[s.id]={onBoard:s.onBoard,x:s.x,y:s.y,z:s.z}; });
  students = temp.filter(s=>s.name.trim()).map(s=>({...s,...(ez[s.id]||{onBoard:false,x:0,y:0,z:0})}));
  persist(); closeModal(); renderAll();
}

load();
